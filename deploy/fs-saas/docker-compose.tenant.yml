# Plantilla por tenant (FS-002). No se usa a mano: la invocan los scripts con -p fs-<slug> --env-file $SECRETS_DIR/<slug>/compose.env
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: facturascripts
    healthcheck: { test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"], interval: 5s, retries: 30 }
    volumes: [dbdata:/var/lib/mysql]
  fs:
    image: ${FS_IMAGE}
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      FS_DB_HOST: db
      FS_DB_USER: root
      FS_DB_PASS: ${DB_ROOT_PASS}
      FS_DB_NAME: facturascripts
      FS_INITIAL_USER: admin
      FS_INITIAL_PASS: ${ADMIN_PASS}
    ports: ["127.0.0.1:${FS_PORT}:80"]   # solo loopback; el reverse proxy (pendiente) publica
    volumes: [fsfiles:/var/www/html/MyFiles]
# red por defecto del proyecto = aislada por tenant
volumes:
  dbdata: { name: "fs-${TENANT}-dbdata" }
  fsfiles: { name: "fs-${TENANT}-myfiles" }
